# What every push and pull request must pass. The same checks run locally with
# `composer check` and `composer test:rename`; the integration suite needs
# Docker, so it runs only here (docs/04-engineering/02-dev-environment.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, PHPStan, Deptrac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: intl, mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer stan
      - run: composer deptrac

  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test:unit

  # The main file, uninstall.php and Requirements must parse on old PHP so an
  # unsupported host gets a notice, not a fatal (implementation-notes §1).
  # PHPCompatibility cannot see PHP 8 syntax, so only a real old PHP proves it.
  legacy-syntax:
    name: Bootstrap files parse on PHP 7.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.0'
          coverage: none
          tools: none
      # php -l takes one file before PHP 8.3.
      - run: |
          for file in vaqtyar.php uninstall.php src/Kernel/Requirements.php; do
            php -l "$file" || exit 1
          done

  rename:
    name: Rename still works (ADR-000)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: intl, mbstring
          coverage: none
      # The renamed copy installs, lints, tests and builds the JS too.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: composer install --no-interaction --no-progress
      - run: composer test:rename

  test-js:
    name: JS lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  i18n:
    name: Translations are complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every string has a fa_IR translation, and the committed files are current.
      - run: pnpm i18n:check
      - run: git diff --exit-code languages

  build:
    name: Build and size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The widget stays under 40 KB gzipped (ADR-007).
      - run: pnpm size

  integration:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
        wp: ['6.6', 'latest']
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
      # Empty means the core from .wp-env.json: the latest release.
      WP_ENV_CORE: ${{ matrix.wp == '6.6' && 'WordPress/WordPress#6.6-branch' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: intl, mbstring
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # Only npx wp-env here: no pnpm, so no automatic pnpm cache (packageManager).
          package-manager-cache: false
      # vendor/ is installed on the host and mounted into the containers.
      - run: composer install --no-interaction --no-progress
      # WooCommerce is an optional plugin (ADR-012): only this job has it, for the gateway's tests (T5.3).
      # Pinned to a release that still supports WP 6.6; an override replaces the plugins list, so "." is repeated.
      - name: Add WooCommerce to the test site
        run: |
          echo '{"plugins":[".","https://downloads.wordpress.org/plugin/woocommerce.9.3.3.zip"]}' > .wp-env.override.json
      - run: npx --yes @wordpress/env@11 start
      - name: Run the integration suite
        run: >-
          npx --yes @wordpress/env@11 run cli
          --env-cwd=wp-content/plugins/${{ github.event.repository.name }}
          composer test:integration

  # ADR-004: 30 parallel POST /holds for one slot through the real web server
  # must give exactly one hold per free staff member (tests/Concurrency).
  concurrency:
    name: Concurrency (no double booking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: intl, mbstring, curl
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: composer install --no-interaction --no-progress --no-dev
      - run: npx --yes @wordpress/env@11 start
      - name: Race for one staff member, then for either of two
        run: |
          seed() {
            npx --yes @wordpress/env@11 run cli --env-cwd=wp-content/plugins/${{ github.event.repository.name }} \
              wp eval-file tests/Concurrency/seed.php > seed.log 2>&1 || { cat seed.log >&2; return 1; }
            json=$(sed -n 's/^SEED //p' seed.log)
            if [ -z "$json" ]; then cat seed.log >&2; return 1; fi
            echo "$json"
          }
          php tests/Concurrency/race.php http://localhost:8888 "$(seed)" staff
          php tests/Concurrency/race.php http://localhost:8888 "$(seed)" any

  # T6.5: the real uninstall.php on a live site. First without the owner's
  # opt-in (nothing may go), then with it (everything of ours goes, nothing
  # else). A script and not a PHPUnit test: dropping the plugin's tables
  # would break every test after it.
  uninstall:
    name: Uninstall (opt-in data removal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: intl, mbstring
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: composer install --no-interaction --no-progress --no-dev
      - run: npx --yes @wordpress/env@11 start
      - name: Keep the data without the opt-in, delete it with
        run: |
          for mode in keep delete; do
            npx --yes @wordpress/env@11 run cli --env-cwd=wp-content/plugins/${{ github.event.repository.name }} \
              wp eval-file tests/Uninstall/run.php "$mode" > uninstall.log 2>&1 || { cat uninstall.log >&2; exit 1; }
            grep "^UNINSTALL OK $mode" uninstall.log || { cat uninstall.log >&2; exit 1; }
          done

  # The admin screens against the real REST API, with the build the plugin
  # ships (tests/e2e). The playwright config logs in as the wp-env admin.
  e2e:
    name: E2E (admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: intl, mbstring
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: composer install --no-interaction --no-progress --no-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: npx --yes @wordpress/env@11 start
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: artifacts/
          retention-days: 7

  # The release zip (T6.6): built as a customer gets it, checked for what it
  # holds and kept as a build artifact. The job fails if the zip holds anything
  # but the plugin, or if the version differs between the header, the constant,
  # readme.txt and CHANGELOG.md (tools/Release/Packager.php).
  package:
    name: Release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: intl, mbstring, zip
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: composer install --no-interaction --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: composer build:zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/*.zip
          retention-days: 14

  # WordPress.org's Plugin Check (T6.4) on the folder the release zip is made
  # from (dist/{slug}, built by composer build:zip), which is what a customer
  # installs. Errors fail the job; warnings are printed first, for a human to
  # read. WordPress.Security.EscapeOutput.ExceptionNotEscaped is ignored: a
  # deliberate policy (implementation-notes §6), exception messages are plain
  # text and every place that shows one escapes it.
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    env:
      IGNORED_CODES: WordPress.Security.EscapeOutput.ExceptionNotEscaped
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: intl, mbstring, zip
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: composer install --no-interaction --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: composer build:zip
      # The folder is named after the slug in identity.json, so a renamed plugin works unchanged.
      - name: Name the plugin
        run: |
          slug=$(php -r 'echo json_decode(file_get_contents("identity.json"))->slug;')
          echo "PLUGIN_SLUG=$slug" >> "$GITHUB_ENV"
          echo "PLUGIN_DIR=wp-content/plugins/$slug" >> "$GITHUB_ENV"
          # Only the built folder is the plugin here: the repository's own copy would define everything twice.
          echo "{\"plugins\":[\"./dist/$slug\"]}" > .wp-env.override.json
      - run: npx --yes @wordpress/env@11 start
      - name: Install Plugin Check
        run: npx --yes @wordpress/env@11 run cli wp plugin install plugin-check --activate
      - name: Warnings (for reading)
        run: >-
          npx --yes @wordpress/env@11 run cli --env-cwd=${{ env.PLUGIN_DIR }}
          wp plugin check ${{ env.PLUGIN_SLUG }}
          --ignore-codes=${{ env.IGNORED_CODES }}
          --format=table
        continue-on-error: true
      # The command reports findings but may still exit 0, so a "FILE:" line
      # (it prints one per file with a finding) is what fails the build.
      - name: Errors (fail the build)
        run: |
          set -o pipefail
          npx --yes @wordpress/env@11 run cli --env-cwd=${{ env.PLUGIN_DIR }} \
            wp plugin check ${{ env.PLUGIN_SLUG }} \
            --ignore-codes=${{ env.IGNORED_CODES }} \
            --ignore-warnings \
            --format=table | tee plugin-check.log
          if grep -q '^FILE:' plugin-check.log; then
            echo '::error::Plugin Check found errors.'
            exit 1
          fi
