# Module isolation (docs/03-architecture/02-architecture.md §2 rule 4 and §3):
# a module reaches another only through that module's Contracts/ (or events).
# Layer rules live in deptrac-layers.yaml; deptrac cannot check both in one
# file because a class would sit in two layers. Paths are relative to this file.
deptrac:
  paths:
    - ../src
  analyser:
    types: [class, use, file, function, function_call]
  layers:
    - name: Kernel
      collectors:
        - type: classNameRegex
          value: '#^Vaqtyar\\Kernel\\#'
    - name: Shared
      collectors:
        - type: classNameRegex
          value: '#^Vaqtyar\\Shared\\#'
    - name: Contracts
      collectors:
        - type: classNameRegex
          value: '#^Vaqtyar\\Modules\\\w+\\Contracts\\#'
    - name: Catalog
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Vaqtyar\\Modules\\Catalog\\#'
          must_not:
            - type: layer
              value: Contracts
    - name: Scheduling
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Vaqtyar\\Modules\\Scheduling\\#'
          must_not:
            - type: layer
              value: Contracts
    - name: Booking
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Vaqtyar\\Modules\\Booking\\#'
          must_not:
            - type: layer
              value: Contracts
    - name: Customers
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Vaqtyar\\Modules\\Customers\\#'
          must_not:
            - type: layer
              value: Contracts
    - name: Payments
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Vaqtyar\\Modules\\Payments\\#'
          must_not:
            - type: layer
              value: Contracts
    - name: Notifications
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Vaqtyar\\Modules\\Notifications\\#'
          must_not:
            - type: layer
              value: Contracts
    - name: Admin
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Vaqtyar\\Modules\\Admin\\#'
          must_not:
            - type: layer
              value: Contracts
    # Anything of ours outside the layers above, e.g. a module not listed here
    # yet: without this it would be "uncovered" and have no isolation at all.
    - name: Unclassified
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^Vaqtyar\\#'
          must_not:
            - type: layer
              value: Kernel
            - type: layer
              value: Shared
            - type: layer
              value: Contracts
            - type: layer
              value: Catalog
            - type: layer
              value: Scheduling
            - type: layer
              value: Booking
            - type: layer
              value: Customers
            - type: layer
              value: Payments
            - type: layer
              value: Notifications
            - type: layer
              value: Admin
  ruleset:
    # How the Kernel learns the module entry classes is decided in T0.3.
    Kernel: [Shared]
    Shared: [Kernel]
    Contracts: [Shared]
    Catalog: [Kernel, Shared, Contracts]
    Scheduling: [Kernel, Shared, Contracts]
    Booking: [Kernel, Shared, Contracts]
    Customers: [Kernel, Shared, Contracts]
    Payments: [Kernel, Shared, Contracts]
    Notifications: [Kernel, Shared, Contracts]
    Admin: [Kernel, Shared, Contracts]
    Unclassified: ~
